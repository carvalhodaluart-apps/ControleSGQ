services:
  postgres:
    image: postgres:16-alpine
    container_name: controle-sgq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-controle_sgq}
      POSTGRES_USER: ${POSTGRES_USER:-controle_sgq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-controle_sgq_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - controle_sgq_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  controle_sgq_pgdata:
